[package]
name = "clay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast Homebrew-compatible package manager"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rayon = "1"
fs2 = "0.4"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
